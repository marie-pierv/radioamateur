<router-outlet />

<div class="exam-container">
  <app-card class="exam-container__card gauche">
    @if (!isExamStarted()) {
      <app-form-start-exam
        class="exam-container__card__form"
        (onStart)="isExamStarted.set(true)"
      ></app-form-start-exam>
    } @else {
      <app-exam-display class="exam-container__card__form"></app-exam-display>
    }
  </app-card>
  @if (isExamStarted()) {
    <app-card class="exam-container__card droit">
      <app-exam-progress class="exam-container__card__progress"></app-exam-progress>
    </app-card>
  }
</div>
