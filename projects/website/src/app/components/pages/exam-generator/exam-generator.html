<router-outlet />

<div class="exam-container">
  <app-card class="exam-container__card">
    @if (!isExamStarted()) {
      <app-form-start-exam (onStart)="isExamStarted.set(true)"></app-form-start-exam>
    } @else {
      <app-exam-display></app-exam-display>
    }
  </app-card>
  @if (isExamStarted()) {
    <app-card class="exam-container__card">
      <app-exam-progress></app-exam-progress>
    </app-card>
  }
</div>
