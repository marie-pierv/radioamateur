@if (link()) {
  <a [routerLink]="link()" [class]="'button-base ' + variant()" [class.disabled]="disabled()">
    <ng-content></ng-content>
  </a>
} @else {
  <button
    [type]="type()"
    [class.selected]="isSelected()"
    [class]="'button-base ' + variant()"
    (click)="onClick()"
    [disabled]="disabled()"
  >
    <ng-content></ng-content>
  </button>
}
