<div class="score-container">
  <app-title variant="h3">Analyse de votre score</app-title>
  <div class="score-container__content">
    @for (stat of globalStatsByCategory(); track stat.code) {
      <div class="score-container__content__category">
        <app-title variant="p">{{ stat.name }}</app-title>
        <app-title variant="p">{{ stat.percent | number: '1.0-0' }} %</app-title>
      </div>
    } @empty {
      <p>Aucune donnée disponible pour le moment.</p>
    }
  </div>
</div>
